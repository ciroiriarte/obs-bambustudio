# Track upstream BambuStudio releases and publish them to OBS, per channel:
#   stable -> home:ciriarte:bambustudio:stable  (newest non-pre-release)
#   beta   -> home:ciriarte:bambustudio:beta    (newest release of any kind)
#
# OBS cannot watch GitHub releases, and the bundled-dependency Source list has
# to be recomputed from upstream's deps/ superbuild on every release, so the
# bump runs here: tools/bump.py detects a newer release for the channel,
# regenerates the bundled sources, publishes the device_page npm store as a
# release asset when its lockfile changed, pins the wxWidgets fork and bumps
# packages/<channel>/bambustudio. This job pushes the result to main and fires
# the runservice token for each bumped channel; OBS re-runs _service (obs_scm
# pulls the recipe, download_files fetches the upstream tarballs) and rebuilds.
# Channels run sequentially in one job so they never race on the push.
#
# Required setting (repo -> Settings -> Secrets and variables -> Actions):
#   secret OBS_SERVICE_TOKEN  runservice token created without a package
#                             binding (see README); valid for both channels
name: upstream bump

on:
  schedule:
    - cron: "37 5 * * *"   # daily, 05:37 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: Channel(s) to process
        required: false
        default: both
        type: choice
        options: [both, stable, beta]
      version:
        description: Bump the selected channel to this upstream version (e.g. 02.08.02.61) instead of its latest (requires a single channel)
        required: false
        type: string
      runservice:
        description: Re-run the OBS service of the selected channel(s) even without a version bump (after a recipe change)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # tools/gen_deps.py configures upstream's deps/ superbuild, whose
      # GLEW/TIFF recipes call find_package(OpenGL REQUIRED) at configure time
      # (even though they are not built); the runner image has no GL dev files.
      - name: Install configure-time requirements
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl-dev libglx-dev libopengl-dev

      - name: Bump channels
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}   # vendor_web.py publishes npm stores via gh
          CHANNEL: ${{ inputs.channel || 'both' }}
          VERSION: ${{ inputs.version }}
          RUNSERVICE: ${{ inputs.runservice || false }}
        run: |
          case "$CHANNEL" in both) channels="stable beta" ;; *) channels="$CHANNEL" ;; esac
          if [[ -n "$VERSION" && "$CHANNEL" == both ]]; then
            echo "::error::--version needs a single channel"; exit 1
          fi
          trigger=""
          for ch in $channels; do
            out=$(python3 tools/bump.py --channel "$ch" --dry-run ${VERSION:+--version "$VERSION"})
            echo "$out"
            if grep -q 'would bump' <<<"$out"; then
              python3 tools/bump.py --channel "$ch" ${VERSION:+--version "$VERSION"}
              trigger="$trigger $ch"
            elif [[ "$RUNSERVICE" == true ]]; then
              trigger="$trigger $ch"
            fi
          done
          echo "trigger=${trigger# }" >> "$GITHUB_OUTPUT"

      - name: Push recipes back to the repo
        run: |
          git diff --quiet packages && exit 0
          msg=""
          for ch in stable beta; do
            git diff --quiet "packages/$ch" && continue
            ver=$(sed -n 's/^Version:[[:space:]]*//p' "packages/$ch/bambustudio/bambustudio.spec")
            msg="${msg:+$msg, }$ch ${ver}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "Update to upstream: ${msg}"
          git push

      - name: Trigger OBS source services
        if: steps.bump.outputs.trigger != ''
        env:
          OBS_SERVICE_TOKEN: ${{ secrets.OBS_SERVICE_TOKEN }}
          TRIGGER: ${{ steps.bump.outputs.trigger }}
        run: |
          for ch in $TRIGGER; do
            curl -fsS --retry 3 --retry-all-errors -X POST \
              -H "Authorization: Token ${OBS_SERVICE_TOKEN}" \
              "https://api.opensuse.org/trigger/runservice?project=home:ciriarte:bambustudio:${ch}&package=bambustudio"
          done
